<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simweb</title>
<meta name="theme-color" content="#1e1f22">
<style>
  :root { --bg: #1e1f22; --panel: #2b2d31; --text: #e3e3e3; --dim: #8a8d93; --teal: #4fd1c5; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; color: var(--text);
    font: 14px/1.5 -apple-system, system-ui, sans-serif;
    background: radial-gradient(circle at 50% 45%, #4fd1c514, transparent 30%), var(--bg); }
  /* Dot grid, faded out well before the edges: the window's edge stays exactly --bg, the title bar's colour. */
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(#ffffff0f 1px, transparent 1.5px) 0 0 / 24px 24px;
    mask: radial-gradient(circle at 50% 45%, #000, transparent 45%); }
  /* Scaled as a whole, so icon, ring, text and spacing keep their proportions. */
  main { position: relative; z-index: 1; text-align: center; padding: 16px; zoom: 1.6; }
  @media (max-width: 700px), (max-height: 600px) { main { zoom: 1; } }
  /* Searching for a signal: a ring spreads from the icon while it waits. */
  .icon { position: relative; display: inline-block; }
  .icon::before { content: ''; position: absolute; inset: 0; border: 1px solid var(--teal); border-radius: 22px;
    opacity: 0; animation: ripple 3s ease-out infinite; }
  img { position: relative; display: block; width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 22px; font-weight: 600; margin: 20px 0 6px; }
  p { color: var(--dim); margin: 0 0 20px; }
  .cmd { display: inline-flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid #ffffff14;
    border-radius: 12px; padding: 8px 8px 8px 16px; font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
  button { background: #ffffff10; color: var(--text); border: 1px solid #ffffff1f; border-radius: 8px; padding: 6px 12px;
    font: 500 12px -apple-system, system-ui, sans-serif; cursor: pointer; }
  button:hover { border-color: #ffffff3d; }
  .wait { margin-top: 24px; font-size: 12px; color: var(--dim); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); margin-right: 8px;
    animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @keyframes ripple { from { opacity: .35; scale: 1; } to { opacity: 0; scale: 1.5; } }
  @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; } }
</style>
</head>
<body>
<main>
  <div class="icon"><img src="/icon-192.png" alt=""></div>
  <h1>simweb isn't running</h1>
  <p>Start it in a terminal and this window reconnects on its own.</p>
  <div class="cmd"><span>simweb</span><button id="copy" type="button">Copy</button></div>
  <div class="wait"><span class="dot"></span>Waiting for simweb…</div>
</main>
<script>
  const copy = document.getElementById('copy')
  copy.onclick = () => navigator.clipboard.writeText('simweb').then(() => { copy.textContent = 'Copied' })
  // Back as soon as the server answers.
  setInterval(() => fetch('/api/state', { cache: 'no-store' }).then((r) => { if (r.ok) location.reload() }, () => {}), 2000)
</script>
</body>
</html>
